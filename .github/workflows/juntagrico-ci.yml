# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: juntagrico-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, release/** ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DJANGO_SETTINGS_MODULE: mehalsgmues.settings
      JUNTAGRICO_SECRET_KEY: fake
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: install dependencies
      run: |
        pip install --upgrade -r requirements-local.txt
    - name: ruff
      run: |
        ruff check --preview mehalsgmues
        ruff check --preview activityprofile
        ruff check --preview mapjob
        ruff check --preview antispam
        ruff check --preview test
    - name: run tests
      run: |
        python -m django makemigrations --noinput
        python -m django collectstatic -c --noinput
        python -m manage test --exclude-tag=playwright
  browser-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DJANGO_SETTINGS_MODULE: mehalsgmues.settings
      JUNTAGRICO_SECRET_KEY: fake
      DJANGO_ALLOW_ASYNC_UNSAFE: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        pip install --upgrade -r requirements-local.txt
    - name: Install Playwright browsers
      run: |
        playwright install chromium
        apt-get update && apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1
    - name: Prepare database and static files
      run: |
        python -m django makemigrations --noinput
        python -m django collectstatic -c --noinput
    - name: Run browser tests
      run: |
        python -m manage test mapjob.test.test_edit_map_browser
